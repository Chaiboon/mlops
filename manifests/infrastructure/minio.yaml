apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: kserve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        args:
        - server
        - /data
        - --console-address
        - :9001
        env:
        - name: MINIO_ROOT_USER 
          valueFrom:
            secretKeyRef:
              name: my-minio-secret
              key: AWS_ACCESS_KEY_ID
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: my-minio-secret
              key: AWS_SECRET_ACCESS_KEY
        ports:
        - containerPort: 9000 # API Port
        - containerPort: 9001 # UI Port
---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: kserve
spec:
  selector:
    app: minio
  ports:
    - name: api
      protocol: TCP
      port: 9000
      targetPort: 9000
    - name: console
      protocol: TCP
      port: 9001
      targetPort: 9001