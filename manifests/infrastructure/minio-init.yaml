apiVersion: batch/v1
kind: Job
metadata:
  name: minio-make-bucket
  namespace: kserve
spec:
  template:
    spec:
      containers:
      - name: create-bucket
        image: minio/mc:latest
        env:
        # Load the same credentials from your Secret
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: my-minio-secret
              key: AWS_ACCESS_KEY_ID
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: my-minio-secret
              key: AWS_SECRET_ACCESS_KEY
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "⏳ Waiting for MinIO to be ready..."
          # Retrying logic in case MinIO is slow to start
          until mc alias set myminio http://minio-service.kserve.svc.cluster.local:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD; do
            echo "zzz... MinIO not ready yet. Retrying in 2 seconds..."
            sleep 2
          done
          
          echo "🚀 Creating bucket 'mlflow'..."
          # mb = make bucket. --ignore-existing prevents errors if run twice.
          mc mb myminio/mlflow --ignore-existing
          
          echo "✅ Bucket created successfully!"
      restartPolicy: OnFailure